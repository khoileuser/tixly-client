name: Build and Push to AWS S3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js static export
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync files to S3 bucket
        run: |
          aws s3 sync out/ s3://${{ vars.S3_BUCKET_NAME }}/ --delete --cache-control max-age=31536000,public
          # Set cache control for HTML files to no-cache for better updates
          aws s3 cp s3://${{ vars.S3_BUCKET_NAME }}/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --recursive \
            --metadata-directive REPLACE \
            --cache-control max-age=0,no-cache,no-store,must-revalidate \
            --content-type "text/html"
